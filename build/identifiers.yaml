# build/identifiers.yaml — shipped blocklist of internal agent names.
# Internal agent names are NOT public-facing terms. They should never appear in
# public documentation, templates, or generated artifacts.
#
# The blocklist carries SHA-256 digests only, never plaintext names:
#
#     digest = sha256(name lowercased, UTF-8).hexdigest()
#
# The release gate hashes the candidate tokens it finds in each file and compares
# the digests below to them, so a plaintext internal name is caught and a file
# that merely carries a digest string is not. Derive a digest for a candidate
# without ever writing the name down:
#
#     python3 build/check-internal-names.py --hash "<candidate>"
#
# Consumer: build/check-internal-names.py, run as a step of build/verify-all.py.

