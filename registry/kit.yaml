# kit.yaml — per-kit manifest + git-registry install contract
# Distribution contract (spec section 5). One kit.yaml per kit.
# Install: `kit install <registry>/<team>` (Claude Code marketplace pattern).

name: team6-kit
version: 1.7.0
description: >
  Multi-agent team kit — identity archetypes, orchestration
  choreography, governance rules, and an instantiable generator. v1.1.0
  encodes the supervised operating layer (OTP-style supervision, durable
  append-only state, phase-gated pipeline, adversarial QA, served-truth and
  license/provenance gates). v1.2.0 adds a vendor-neutral local preprocessing
  adapter contract (Redact/Gist/Title + opt-in media) as documentation, not a
  bundled dependency. Open core under Apache-2.0; vertical packs are
  proprietary parameter files. v1.3.0 documents the ingestion definition of
  done for directly handed-over sources: a handover is not complete at
  storage/indexing - it requires a capability/usefulness audit, a capability
  matrix with an owner and a disposition per candidate, bounded proof rather
  than a wholesale install, and durable receipts with independent read-back.
  It also documents the propagation loop: one machine-readable capability delta
  per candidate, impact-class routing to the capability owner, a single
  append-only propagation journal, batching of compatible candidates instead of
  one public change per ingestion, a per-candidate preflight with the full
  audit reserved for the batch/release boundary, and repository/site parity with
  independent read-back. Documentation only; no dependency added or bundled.
  v1.5.0 ships the artifact-contract handoff capability: a machine-checkable
  per-boundary handoff file (expected artifacts, required sections, size
  bounds, tests, evidence refs, runtime state, failure state, last stable and
  resume phase, feedback, regenerate/freeze sets) with a dependency-free
  validator, generated into the kit under contracts/. Team6 Kanban remains
  the state authority; the contract is a handoff snapshot, not a second
  orchestration runtime.
  v1.7.0 adds two documentation-first contracts with dependency-free local
  validators: a grouped scored-rollout JSONL interchange format (run header,
  group declarations, scored samples; evaluation handling, off-policy caps,
  and allocation minima recorded and validated as metadata) and a declarative
  reward catalogue (metadata only; stable reward identities and declared
  behaviour, validated before use, never imported or executed). Neither adds a
  trainer, rollout service, inference server, reward executor, or dependency.
  The grouped scored-rollout contract and its checker ship into generated kits
  under contracts/; the reward catalogue stays a source-repo registry example.

registry: git@github.com:{ORG}/team6-kit.git
home: https://team6.askaconsult.com/      # intended public Team6 site (v1.2.0 public-domain decision)
source_mirror: ""  # GitHub Pages is not used; canonical site is home
repo: https://github.com/ahrazzle/team6-kit
links_back: https://askaconsult.com/digital/  # Team6 site -> ASKA Digital

templates:
  hash: sha256:{TEMPLATES_HASH}      # set at build; any drift = build failure
  dir: templates/
  rows: 126                          # TEMPLATE rows in manifest.tsv (live)

build:
  engine: build/generate.py          # the ONLY assembly path
  gates:
    - build/sweep-gate.py            # precondition: source clean + classified
    - build/review-gate.py           # semantic sign-off (4/4 checkboxes)
  generic_ship:                      # authored-fresh kit files, no manifest row
    # documentation mirror; the operative list is GENERIC_SHIP in generate.py
    - templates/contracts/artifact-contract.md.tmpl   # -> contracts/ in output
    - choreography/artifact-contract.md              # -> contracts/ in output
    - build/check-artifact-contract.py               # -> contracts/ in output
    - examples/artifact-contract.valid.yaml          # -> contracts/examples/
    - examples/artifact-contract.invalid.yaml        # -> contracts/examples/
    # v1.7.0 grouped scored-rollout contract (documentation mirror; the
    # operative list is GENERIC_SHIP in generate.py)
    - templates/contracts/scored-rollout-group.jsonl.tmpl  # -> contracts/
    - choreography/scored-rollouts.md                # -> contracts/
    - build/check-scored-rollout.py                  # -> contracts/
    - examples/scored-rollout-group.valid.jsonl      # -> contracts/examples/
    - examples/scored-rollout-group.invalid.jsonl    # -> contracts/examples/
    # v1.7.0 declarative reward catalogue: SOURCE-REPO ONLY. The catalogue
    # (registry/reward-functions.yaml.example) and its validator
    # (build/check-reward-registry.py) with fixtures are deliberately NOT
    # shipped into generated kits — no Python module or executable reward
    # registration code enters GENERIC_SHIP. The only allowed mapping, if the
    # kit were to copy the example, is registry/reward-functions.yaml.example
    # -> registry/reward-functions.yaml.example (verbatim, no substitution).
  strict: --strict                   # paid packs: unresolved placeholder = FAIL

# Declared-schema contract (team, asymmetric):
#   declared ⊆ resolved = FAIL (pack promised a placeholder, didn't deliver — typo case)
#   resolved ∖ declared = WARN (extra tokens like {BK} are legit code literals / drift)
#   unresolved tokens   = WARN in open core (generic by design), FAIL with --strict
placeholders: [TEAM_NAME, DIRECTOR_NAME, AGENT_NAME, PROFILE_NAME,
               ROLE_NAME, ROLE_MISSION, ROLE_PURPOSE,
               MODEL_PROVIDER, MODEL_NAME, BASE_URL,
               CLIENT, RELATIONSHIP, AMOUNT, HABIT, MODEL, PROFILES]

required_env:                        # set by the installer at instantiation
  - MODEL_PROVIDER
  - MODEL_NAME

packs:                               # vertical packs = parameter files, NOT forks
  consulting-agency: registry/packs/consulting-agency.yaml   # first pack (draft)
  research-analysis: registry/packs/research-analysis.yaml   # planned

install:
  method: git-registry               # marketplace pattern; no new infra
  steps:
    - clone registry into kits cache
    - run build/generate.py --params <pack> --out <workspace>
    - run sweep-gate + review-gate preconditions
    - emit AUDIT.md provenance trail

license:
  core: Apache-2.0
  packs: proprietary-by-contract     # parameter files + service, never a fork
