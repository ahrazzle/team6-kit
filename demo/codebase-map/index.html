<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Team6 codebase-map proof</title>
<!--
  demo/codebase-map/index.html — a self-contained, zero-dependency static
  treemap viewer for the Team6 codebase-map snapshot contract
  (choreography/codebase-map.md).

  Boundaries (see demo/codebase-map/README.md):
    - no external assets, fonts, scripts, or network calls of any kind
    - reads ONE local fixture (examples/codebase-map.valid.json) via a
      same-origin fetch served by a local static server
    - the map is a SNAPSHOT projection, never a live repository view
    - area is a declared measure (bytes/lines), never importance
  Slice 2 implements the t6-squarified-v1 baseline only.
-->
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --ink: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #7dd3fc;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
  }
  header { padding: 16px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta code { color: var(--accent); }
  #notice {
    margin: 10px 20px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--muted);
    font-size: 12.5px;
  }
  #notice strong { color: var(--ink); }
  #error {
    display: none; margin: 10px 20px; padding: 12px 14px;
    border: 1px solid var(--err); border-radius: 8px; background: #2a1618;
    color: #fecaca; font-size: 13px;
  }
  #error h2 { margin: 0 0 6px; font-size: 14px; color: #fecaca; }
  #error ul { margin: 6px 0 0; padding-left: 20px; }
  #map-wrap { padding: 6px 20px 20px; }
  #map { width: 100%; height: auto; display: block; background: #0b0d11;
         border: 1px solid var(--line); border-radius: 8px; }
  .leaf { stroke: #0b0d11; stroke-width: 1; }
  .node-box { fill: none; stroke: #7c8798; stroke-width: 1.25; }
  .node-band { fill: rgba(124,135,152,0.16); }
  text { font-family: inherit; pointer-events: none; }
  .label-leaf { font-size: 11px; fill: #0b0d11; }
  .label-node { font-size: 10.5px; fill: #cfd6e2; }
  footer { padding: 0 20px 24px; color: var(--muted); font-size: 12px; }
  footer code { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Codebase-map snapshot proof</h1>
  <div class="meta" id="meta">Loading snapshot…</div>
</header>

<div id="notice">
  <strong>This is a snapshot projection, not a live repository view.</strong>
  Rectangle area is the snapshot's declared <em>measure</em>; it is not
  importance, risk, or quality. Color is a display token, not a grade.
</div>

<div id="error" role="alert" aria-live="assertive"></div>

<div id="selftest" aria-live="polite"></div>

<div id="map-wrap">
  <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Treemap of the codebase-map snapshot">
    <g id="scene"></g>
  </svg>
</div>

<footer id="receipt" aria-live="polite"></footer>

<script>
"use strict";

// ---------------------------------------------------------------------------
// contract constants — kept in lockstep with choreography/codebase-map.md
// ---------------------------------------------------------------------------
var CONTRACT_TOKEN = "team6-codebase-map";
var CONTRACT_VERSION = 1;
var ALGORITHM_ENUM = ["t6-squarified-v1"];
var MEASURE_ENUM = ["bytes", "lines"];
var SORT_ENUM = ["lexical", "size-desc", "size-asc"];
var SOURCE_KIND_ENUM = ["synthetic", "repository-snapshot"];
var COLOR_ENUM = ["blue", "green", "amber", "slate", "violet", "red", "unknown"];
var COLOR_FILL = {
  blue: "#93c5fd", green: "#86efac", amber: "#fcd34d", slate: "#cbd5e1",
  violet: "#c4b5fd", red: "#fca5a5", unknown: "#5b6472"
};
var LAYOUT_W = 1000, LAYOUT_H = 640;   // fixed logical viewport (viewBox)
var PRECISION = 3;                     // documented serialization precision

var DEFAULT_FIXTURE = "../../examples/codebase-map.valid.json";

// ---------------------------------------------------------------------------
// client-side shape validation — mirrors the contract's rules; a failure is
// visible and renders nothing (fail closed, never a partial map)
// ---------------------------------------------------------------------------
function isPlainObject(x) {
  return x !== null && typeof x === "object" && !Array.isArray(x);
}

function isRelPath(p, allowEmpty) {
  if (typeof p !== "string") return false;
  if (p === "") return !!allowEmpty;
  if (p.charAt(0) === "/" || p.charAt(0) === "~") return false;
  if (p.indexOf("\\") !== -1 || p.indexOf(":") !== -1) return false;
  if (p.indexOf("//") !== -1) return false;
  var segs = p.split("/");
  for (var i = 0; i < segs.length; i++) {
    if (segs[i] === "" || segs[i] === "." || segs[i] === "..") return false;
  }
  return true;
}

function validateSnapshot(doc) {
  var v = [];
  if (!isPlainObject(doc)) return ["document is not a JSON object"];
  var req = ["contract", "version", "source_kind", "included_roots",
             "excluded_patterns", "measure", "sort", "generated_at",
             "provenance", "rendering", "tree"];
  req.forEach(function (k) {
    if (!(k in doc)) v.push("missing required field '" + k + "'");
  });
  if (doc.contract !== CONTRACT_TOKEN) {
    v.push("contract must be '" + CONTRACT_TOKEN + "'");
  }
  if (doc.version !== CONTRACT_VERSION) {
    v.push("unsupported version " + JSON.stringify(doc.version) +
           " (this viewer accepts " + CONTRACT_VERSION + ")");
  }
  if (SOURCE_KIND_ENUM.indexOf(doc.source_kind) === -1) {
    v.push("source_kind '" + doc.source_kind + "' is not a declared value");
  }
  if (MEASURE_ENUM.indexOf(doc.measure) === -1) {
    v.push("measure '" + doc.measure + "' is not a declared value");
  }
  if (SORT_ENUM.indexOf(doc.sort) === -1) {
    v.push("sort '" + doc.sort + "' is not a declared ordering policy");
  }
  if (!Array.isArray(doc.included_roots) || doc.included_roots.length === 0) {
    v.push("included_roots must be a non-empty list");
  }
  if (!Array.isArray(doc.excluded_patterns)) {
    v.push("excluded_patterns must be a list");
  }
  if (!isPlainObject(doc.provenance) || !doc.provenance.kind ||
      !doc.provenance.ref) {
    v.push("provenance.kind and provenance.ref are required");
  }
  var algo = isPlainObject(doc.rendering) ? doc.rendering.algorithm : null;
  if (ALGORITHM_ENUM.indexOf(algo) === -1) {
    v.push("rendering.algorithm '" + algo + "' is not a supported mode " +
           "(this viewer implements " + ALGORITHM_ENUM.join(", ") + ")");
  }
  var seen = {};
  (function walk(e, where, depth) {
    if (!isPlainObject(e)) { v.push(where + ": entity is not an object"); return; }
    if (e.kind !== "Node" && e.kind !== "Leaf") {
      v.push(where + ": kind must be 'Node' or 'Leaf'");
      return;
    }
    if (typeof e.label !== "string" || e.label === "") {
      v.push(where + ": label must be a non-empty string");
    }
    if (!isRelPath(e.path, depth === 0)) {
      v.push(where + ": path must be a normalized relative identity");
    } else if (e.path !== "") {
      if (seen[e.path]) v.push(where + ": duplicate identity '" + e.path + "'");
      seen[e.path] = true;
    }
    if (e.kind === "Node") {
      if (!Array.isArray(e.children) || e.children.length === 0) {
        v.push(where + ": Node children must be a non-empty array");
      } else {
        e.children.forEach(function (c, i) {
          walk(c, where + ".children[" + i + "]", depth + 1);
        });
      }
    } else {
      if (typeof e.size !== "number" || !isFinite(e.size) ||
          Math.floor(e.size) !== e.size || e.size < 0) {
        v.push(where + ": Leaf size must be a non-negative integer");
      }
      if (COLOR_ENUM.indexOf(e.color) === -1) {
        v.push(where + ": color '" + e.color + "' is not a declared token");
      }
    }
  })(doc.tree, "tree", 0);
  return v;
}

// ---------------------------------------------------------------------------
// squarified layout (clean-room). Applies the squarified algorithm to the
// snapshot's DECLARED child order — it does not re-sort, because child order
// is part of the snapshot (choreography/codebase-map.md).
// ---------------------------------------------------------------------------
function worstAspect(rowAreas, side, scale) {
  var sum = 0, mx = -Infinity, mn = Infinity, i, a;
  for (i = 0; i < rowAreas.length; i++) {
    a = rowAreas[i] * scale; sum += a;
    if (a > mx) mx = a;
    if (a < mn) mn = a;
  }
  if (sum <= 0 || mn <= 0) return Infinity;
  var s2 = sum * sum, w2 = side * side;
  return Math.max((w2 * mx) / s2, s2 / (w2 * mn));
}

function squarifyLayout(areas, rect) {
  var out = [];
  var items = areas.slice();
  var total = 0, i;
  for (i = 0; i < items.length; i++) total += items[i];
  if (total <= 0) {                       // degenerate: divide evenly
    items = items.map(function () { return 1; });
    total = items.reduce(function (a, b) { return a + b; }, 0);
  }
  var scale = (rect.w * rect.h) / total;
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h;

  while (items.length) {
    var side = Math.min(w, h);
    var row = [items[0]];
    var rest = items.slice(1);
    while (rest.length) {
      var w1 = worstAspect(row, side, scale);
      var w2 = worstAspect(row.concat([rest[0]]), side, scale);
      if (w2 <= w1) { row.push(rest[0]); rest = rest.slice(1); }
      else break;
    }
    var rowSum = 0;
    for (i = 0; i < row.length; i++) rowSum += row[i] * scale;
    if (w >= h) {                          // lay the row as a vertical strip
      var rw = rowSum / h;
      var oy = y;
      for (i = 0; i < row.length; i++) {
        var rh = (row[i] * scale) / rw;
        out.push({ x: x, y: oy, w: rw, h: rh });
        oy += rh;
      }
      x += rw; w -= rw;
    } else {                               // lay the row as a horizontal strip
      var rhh = rowSum / w;
      var ox = x;
      for (i = 0; i < row.length; i++) {
        var rww = (row[i] * scale) / rhh;
        out.push({ x: ox, y: y, w: rww, h: rhh });
        ox += rww;
      }
      y += rhh; h -= rhh;
    }
    items = rest;
  }
  return out;
}

function r3(n) { return Math.round(n * 1000) / 1000; }

// ---------------------------------------------------------------------------
// render
// ---------------------------------------------------------------------------
function computeRects(root) {
  var rects = [];
  (function walk(entity, rect, depth) {
    var item = {
      path: entity.path, label: entity.label, kind: entity.kind, depth: depth,
      x: r3(rect.x), y: r3(rect.y), w: r3(Math.max(rect.w, 0)),
      h: r3(Math.max(rect.h, 0))
    };
    if (entity.kind === "Leaf") {
      item.size = entity.size; item.color = entity.color;
      rects.push(item);
      return;
    }
    rects.push(item);
    var pad = 8, band = 15;
    var inner = {
      x: rect.x + pad, y: rect.y + pad + band,
      w: Math.max(rect.w - 2 * pad, 1),
      h: Math.max(rect.h - 2 * pad - band, 1)
    };
    var areas = entity.children.map(function (c) {
      return c.kind === "Leaf" ? Math.max(c.size, 0) : subtreeArea(c);
    });
    var laid = squarifyLayout(areas, inner);
    entity.children.forEach(function (c, i) {
      walk(c, laid[i], depth + 1);
    });
  })(root, { x: 0, y: 0, w: LAYOUT_W, h: LAYOUT_H }, 0);
  return rects;
}

function subtreeArea(e) {
  if (e.kind === "Leaf") return Math.max(e.size, 0);
  var sum = 0;
  e.children.forEach(function (c) { sum += subtreeArea(c); });
  return sum;
}

function el(name, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (var k in attrs) { n.setAttribute(k, attrs[k]); }
  return n;
}

function drawRects(rects) {
  var scene = document.getElementById("scene");
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  rects.forEach(function (r) {
    var g = el("g", {});
    if (r.kind === "Leaf") {
      g.appendChild(el("rect", {
        class: "leaf", x: r.x, y: r.y, width: r.w, height: r.h,
        fill: COLOR_FILL[r.color] || COLOR_FILL.unknown
      }));
      if (r.w > 26 && r.h > 12) {
        var t = el("text", {
          class: "label-leaf", x: r.x + 4, y: r.y + 13
        });
        t.textContent = r.label;      // text, never markup
        g.appendChild(t);
      }
    } else {
      g.appendChild(el("rect", {
        class: "node-box", x: r.x, y: r.y, width: r.w, height: r.h
      }));
      g.appendChild(el("rect", {
        class: "node-band", x: r.x, y: r.y, width: r.w, height: 15
      }));
      if (r.w > 20) {
        var ln = el("text", { class: "label-node", x: r.x + 5, y: r.y + 11 });
        ln.textContent = r.label + "/";
        g.appendChild(ln);
      }
    }
    scene.appendChild(g);
  });
}

// ---------------------------------------------------------------------------
// receipt — the read-back surface a browser test can query
// ---------------------------------------------------------------------------
var state = {
  algorithm: null, sourceKind: null, provenanceRef: null, measure: null,
  sort: null, fixture: null, fixtureSha256: null,
  rects: [], nodeCount: 0, leafCount: 0, errors: [], loaded: false
};

function sha256Hex(text) {
  if (!window.crypto || !window.crypto.subtle) return null;
  var bytes = new TextEncoder().encode(text);
  return window.crypto.subtle.digest("SHA-256", bytes).then(function (buf) {
    var arr = new Uint8Array(buf), s = "";
    for (var i = 0; i < arr.length; i++) {
      s += ("0" + arr[i].toString(16)).slice(-2);
    }
    return s;
  }).catch(function () { return null; });
}

function showError(violations) {
  var box = document.getElementById("error");
  box.style.display = "block";
  while (box.firstChild) box.removeChild(box.firstChild);
  var h = document.createElement("h2");
  h.textContent = "Snapshot rejected — the map was not rendered.";
  box.appendChild(h);
  var ul = document.createElement("ul");
  violations.forEach(function (x) {
    var li = document.createElement("li"); li.textContent = x; ul.appendChild(li);
  });
  box.appendChild(ul);
  var scene = document.getElementById("scene");
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  document.getElementById("meta").textContent = "No valid snapshot loaded.";
  document.getElementById("receipt").textContent = "";
}

function renderSnapshot(doc, origin) {
  var v = validateSnapshot(doc);
  state.errors = v;
  if (v.length) { showError(v); state.loaded = false; return false; }

  var rects = computeRects(doc.tree);
  drawRects(rects);

  state.algorithm = doc.rendering.algorithm;
  state.sourceKind = doc.source_kind;
  state.provenanceRef = doc.provenance.ref;
  state.measure = doc.measure;
  state.sort = doc.sort;
  state.fixture = origin || null;
  state.rects = rects;
  state.nodeCount = rects.filter(function (r) { return r.kind === "Node"; }).length;
  state.leafCount = rects.filter(function (r) { return r.kind === "Leaf"; }).length;
  state.loaded = true;

  document.getElementById("error").style.display = "none";
  document.getElementById("meta").textContent = "";

  var meta = document.getElementById("meta");
  var parts = [
    "algorithm ", span(doc.rendering.algorithm),
    " · source_kind ", span(doc.source_kind),
    " · measure ", span(doc.measure),
    " · sort ", span(doc.sort),
    " · provenance ", span(doc.provenance.ref)
  ];
  parts.forEach(function (p) {
    if (typeof p === "string") meta.appendChild(document.createTextNode(p));
    else meta.appendChild(p);
  });

  var rc = document.getElementById("receipt");
  rc.textContent = "Receipt — algorithm " + state.algorithm +
    " · fixture " + (state.fixture || "(inline)") +
    " · fixture_sha256 " + (state.fixtureSha256 || "(computing)") +
    " · viewport " + LAYOUT_W + "x" + LAYOUT_H +
    " · rect_count " + rects.length +
    " · nodes " + state.nodeCount + " · leaves " + state.leafCount +
    " · precision " + PRECISION + "dp";
  return true;
}

function span(text) {
  var s = document.createElement("code");
  s.textContent = text;
  return s;
}

function receipt() {
  return {
    contract: CONTRACT_TOKEN,
    version: CONTRACT_VERSION,
    loaded: state.loaded,
    algorithm: state.algorithm,
    source_kind: state.sourceKind,
    measure: state.measure,
    sort: state.sort,
    provenance_ref: state.provenanceRef,
    fixture: state.fixture,
    fixture_sha256: state.fixtureSha256,
    viewport: { w: LAYOUT_W, h: LAYOUT_H },
    rect_count: state.rects.length,
    node_count: state.nodeCount,
    leaf_count: state.leafCount,
    precision: PRECISION,
    errors: state.errors.slice(),
    rects: state.rects
  };
}

function load(url) {
  return fetch(url, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
      return res.text();
    })
    .then(function (text) {
      var doc;
      try { doc = JSON.parse(text); }
      catch (e) { showError(["snapshot is not valid JSON: " + e.message]); return false; }
      return sha256Hex(text).then(function (h) {
        state.fixtureSha256 = h;
        return renderSnapshot(doc, url);
      });
    })
    .catch(function (e) {
      showError([
        "could not load the fixture (" + e.message + ").",
        "Serve this page from a local static server at the repository root,",
        "e.g.  python3 -m http.server 8000  then open " +
        "http://localhost:8000/demo/codebase-map/index.html"
      ]);
      return false;
    });
}

// ---------------------------------------------------------------------------
// diagnostic mode (?selftest=1) — runs the contract's edge cases through the
// SAME render path so the boundary behavior is observable in a browser. It
// uses inline objects only: no file reads, no network, no external assets.
// ---------------------------------------------------------------------------
function makeSnapshot(tree, over) {
  var base = {
    contract: CONTRACT_TOKEN, version: CONTRACT_VERSION,
    source_kind: "synthetic", included_roots: ["x"], excluded_patterns: [],
    measure: "bytes", sort: "lexical", generated_at: "inline",
    provenance: { kind: "inline-test", ref: "index.html#selftest" },
    rendering: { algorithm: ALGORITHM_ENUM[0] }, tree: tree
  };
  if (over) { for (var k in over) { base[k] = over[k]; } }
  return base;
}

function runSelfTest() {
  var lines = [];
  function check(name, ok) { lines.push((ok ? "PASS " : "FAIL ") + name); }

  // 1. one-leaf tree renders (root + single leaf = 2 rectangles)
  var one = makeSnapshot({ kind: "Node", label: "solo", path: "",
    children: [{ kind: "Leaf", label: "only.txt", path: "solo/only.txt",
                 size: 1, color: "slate" }] });
  check("one-leaf renders", renderSnapshot(one, "inline:one-leaf") === true
        && receipt().rect_count === 2);

  // 2. nested nodes render
  var nested = makeSnapshot({ kind: "Node", label: "r", path: "",
    children: [{ kind: "Node", label: "d", path: "r/d", children: [
      { kind: "Leaf", label: "f", path: "r/d/f", size: 2, color: "blue" }] }] });
  check("nested nodes render", renderSnapshot(nested, "inline:nested") === true
        && receipt().rect_count === 3);

  // 3. empty directory (children: []) fails visibly, renders nothing
  var empty = makeSnapshot({ kind: "Node", label: "r", path: "",
    children: [{ kind: "Node", label: "e", path: "r/e", children: [] }] });
  var okEmpty = (renderSnapshot(empty, "inline:empty") === false
                 && document.getElementById("scene").childNodes.length === 0);
  check("empty-children snapshot fails closed (no partial map)", okEmpty);

  // 4. unknown rendering mode is rejected, not defaulted
  var bad = makeSnapshot({ kind: "Node", label: "r", path: "",
    children: [{ kind: "Leaf", label: "f", path: "r/f", size: 1,
                 color: "blue" }] }, { rendering: { algorithm: "unknown-mode" } });
  check("unknown algorithm rejected",
        renderSnapshot(bad, "inline:bad-algo") === false);

  var box = document.getElementById("selftest");
  box.textContent = "SELF-TEST\n" + lines.join("\n");
  state.selftest = lines;
  return lines;
}

// exposed for the browser read-back test
window.__codebaseMap = {
  renderSnapshot: renderSnapshot,
  load: load,
  receipt: receipt,
  validateSnapshot: validateSnapshot,
  computeRects: computeRects,
  runSelfTest: runSelfTest,
  constants: {
    algorithmEnum: ALGORITHM_ENUM, layout: { w: LAYOUT_W, h: LAYOUT_H },
    precision: PRECISION
  }
};

if (typeof document !== "undefined" && document.getElementById("scene")) {
  var qs = new URLSearchParams(window.location.search);
  var fx = qs.get("fixture");
  if (fx) {
    // keep the boundary explicit: only a relative, same-origin path is allowed
    if (/^[a-z][a-z0-9+.-]*:/i.test(fx) || fx.indexOf("//") === 0 ||
        fx.charAt(0) === "/") {
      showError(["fixture must be a relative path within this origin (no " +
                 "absolute URL)"]);
    } else {
      load(fx).then(function () {
        if (qs.get("selftest") === "1") runSelfTest();
      });
    }
  } else if (qs.get("selftest") === "1") {
    runSelfTest();
  } else {
    load(DEFAULT_FIXTURE);
  }
}
</script>
</body>
</html>
